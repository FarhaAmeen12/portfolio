<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Farha</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .error-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 10;
    }
    .error-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: clamp(32px, 6vw, 56px);
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .error-code {
      font-size: clamp(4.5rem, 12vw, 7rem);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 12px;
      background: var(--grad-hero);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-title {
      font-size: clamp(1.4rem, 3vw, 1.85rem);
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="error-page-container">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Oops! This page doesn't exist.</h1>
      <p class="error-desc">
        The link you followed may be broken or the page might have been removed. Let's get you back to the home page.
      </p>
      <a href="./index.html" class="btn btn-primary" style="display:inline-flex;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Back Home
      </a>
    </div>
  </div>
</body>
</html>
