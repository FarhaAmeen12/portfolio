<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Farha Portfolio</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%230891b2%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/><line x1=%2212%22 y1=%228%22 x2=%2212%22 y2=%2212%22/><line x1=%2212%22 y1=%2216%22 x2=%2212.01%22 y2=%2216%22/></svg>">
  <link rel="stylesheet" href="./styles.css">
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('farha_theme');
        if (saved === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    .error-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 10;
    }
    .error-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: clamp(32px, 6vw, 56px);
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .error-code {
      font-size: clamp(4.5rem, 12vw, 7rem);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 12px;
      color: var(--primary);
    }
    .error-title {
      font-size: clamp(1.4rem, 3vw, 1.85rem);
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="error-page-container">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">
        The page you requested could not be located or may have been moved.
      </p>
      <a href="./#home" class="btn btn-primary" style="display:inline-flex; align-items:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Return to Portfolio
      </a>
    </div>
  </div>
</body>
</html>
