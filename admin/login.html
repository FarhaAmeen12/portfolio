<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Farha Portfolio CMS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%230891b2%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%2211%22 width=%2218%22 height=%2211%22 rx=%222%22 ry=%222%22/><path d=%22M7 11V7a5 5 0 0 1 10 0v4%22/></svg>">
  <link rel="stylesheet" href="../styles.css">
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('farha_theme');
        if (saved === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px;">

  <!-- Theme Toggle Floating -->
  <div style="position: absolute; top: 20px; right: 20px;">
    <button class="theme-btn" id="theme-toggle" aria-label="Toggle Light and Dark Theme">
      <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>

  <div style="width: 100%; max-width: 440px;">
    <!-- Brand / Return Home -->
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="../#home" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-main); font-weight: 700; font-size: 1.5rem; letter-spacing: -0.02em;">
        <span>FARHA</span>
        <span style="width: 8px; height: 8px; background: var(--primary); border-radius: 50%;"></span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 6px;">
        Content Management System & Administration
      </p>
    </div>

    <!-- Login Card -->
    <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 36px 32px; box-shadow: var(--shadow-card);">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(8, 145, 178, 0.12); display: flex; align-items: center; justify-content: center; color: var(--primary); border: 1px solid rgba(8, 145, 178, 0.25);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <div>
          <h1 style="font-size: 1.35rem; font-weight: 700; line-height: 1.2;">Admin Sign In</h1>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Enter authorized credentials to continue</p>
        </div>
      </div>

      <!-- Alert Box -->
      <div id="login-alert" style="display: none; padding: 12px 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 20px;"></div>

      <form id="admin-login-form">
        <div style="margin-bottom: 18px;">
          <label for="admin-email" style="display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">
            Admin Email
          </label>
          <div style="position: relative;">
            <input type="email" id="admin-email" name="email" required autocomplete="email" placeholder="admin@farha.dev" value="admin@farha.dev"
              style="width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px; border: 1px solid var(--border-subtle); background: var(--bg-surface-elevated); color: var(--text-main); font-size: 0.95rem; outline: none; transition: border-color var(--transition-fast);">
            <svg style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </div>
        </div>

        <div style="margin-bottom: 24px;">
          <label for="admin-password" style="display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">
            Password
          </label>
          <div style="position: relative;">
            <input type="password" id="admin-password" name="password" required autocomplete="current-password" placeholder="••••••••••••" value="AdminFarha2026!"
              style="width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px; border: 1px solid var(--border-subtle); background: var(--bg-surface-elevated); color: var(--text-main); font-size: 0.95rem; outline: none; transition: border-color var(--transition-fast);">
            <svg style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 600; justify-content: center; gap: 8px;">
          <span>Sign In to Dashboard</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-subtle); text-align: center;">
        <a href="../#home" style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; color: var(--text-muted); text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Return to Public Portfolio
        </a>
      </div>
    </div>
  </div>

  <script>
    // Theme toggle handler
    const themeBtn = document.getElementById('theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('farha_theme', next);
        updateThemeIcons();
      });
      function updateThemeIcons() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const sun = themeBtn.querySelector('.sun-icon');
        const moon = themeBtn.querySelector('.moon-icon');
        if (sun && moon) {
          sun.style.display = isDark ? 'block' : 'none';
          moon.style.display = isDark ? 'none' : 'block';
        }
      }
      updateThemeIcons();
    }

    // Login Form Submit Handler
    const form = document.getElementById('admin-login-form');
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('login-submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>Verifying credentials...</span>`;

      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Store token in localStorage for backup API authorization headers
          if (data.token) {
            localStorage.setItem('farha_token', data.token);
          }
          alertBox.style.display = 'block';
          alertBox.style.background = 'rgba(34, 197, 94, 0.12)';
          alertBox.style.color = 'var(--accent-emerald)';
          alertBox.style.border = '1px solid rgba(34, 197, 94, 0.25)';
          alertBox.textContent = 'Authentication successful! Redirecting...';

          setTimeout(() => {
            window.location.href = '/admin';
          }, 600);
        } else {
          alertBox.style.display = 'block';
          alertBox.style.background = 'rgba(239, 68, 68, 0.12)';
          alertBox.style.color = '#ef4444';
          alertBox.style.border = '1px solid rgba(239, 68, 68, 0.25)';
          alertBox.textContent = data.error || 'Invalid credentials. Please verify email and password.';
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Sign In to Dashboard</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
        }
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(239, 68, 68, 0.12)';
        alertBox.style.color = '#ef4444';
        alertBox.style.border = '1px solid rgba(239, 68, 68, 0.25)';
        alertBox.textContent = 'Network or server error during login. Please try again.';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Sign In to Dashboard</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
      }
    });
  </script>
</body>
</html>
